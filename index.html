<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather App - Aqib Naveed</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-500 to-purple-600 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white rounded-3xl shadow-2xl p-8 w-full max-w-md">
    <h1 class="text-2xl font-bold text-center mb-2">Weather App</h1>
    <p class="text-center text-gray-500 text-sm mb-6">Made by Aqib Naveed</p>

    <div class="flex gap-2 mb-6">
      <input id="cityInput" type="text" placeholder="City likho e.g. Karachi" class="flex-1 border border-gray-300 rounded-full px-5 py-3 outline-none focus:border-black">
      <button onclick="getWeather()" class="bg-black text-white px-6 py-3 rounded-full font-medium">Search</button>
    </div>

    <div id="weatherCard" class="bg-gray-50 rounded-2xl p-6 text-center hidden">
      <h2 id="cityName" class="text-3xl font-bold">Karachi</h2>
      <p id="temp" class="text-6xl font-bold mt-4">32°C</p>
      <p id="desc" class="text-gray-600 mt-2 capitalize">Sunny</p>

      <div class="grid grid-cols-2 gap-4 mt-8">
        <div class="bg-white p-4 rounded-xl">
          <p class="text-gray-400 text-sm">Humidity</p>
          <p id="humidity" class="font-bold text-lg">45%</p>
        </div>
        <div class="bg-white p-4 rounded-xl">
          <p class="text-gray-400 text-sm">Wind Speed</p>
          <p id="wind" class="font-bold text-lg">10 km/h</p>
        </div>
      </div>
    </div>

    <p class="text-center text-xs text-gray-400 mt-6">Tip: Karachi, Lahore, Islamabad, Dubai try karo</p>
  </div>

<script>
const demoWeather = {
  "karachi": { temp: "34°C", desc: "Sunny & Hot", humidity: "55%", wind: "12 km/h" },
  "lahore": { temp: "28°C", desc: "Cloudy", humidity: "70%", wind: "8 km/h" },
  "islamabad": { temp: "22°C", desc: "Rainy", humidity: "85%", wind: "15 km/h" },
  "dubai": { temp: "38°C", desc: "Very Sunny", humidity: "40%", wind: "10 km/h" },
  "default": { temp: "26°C", desc: "Clear Sky", humidity: "60%", wind: "9 km/h" }
};

function getWeather(){
  let city = document.getElementById("cityInput").value.toLowerCase().trim();
  if(!city){ alert("City ka naam likho!"); return; }

  let data = demoWeather[city] || demoWeather["default"];

  document.getElementById("cityName").innerText = city.charAt(0).toUpperCase() + city.slice(1);
  document.getElementById("temp").innerText = data.temp;
  document.getElementById("desc").innerText = data.desc;
  document.getElementById("humidity").innerText = data.humidity;
  document.getElementById("wind").innerText = data.wind;

  document.getElementById("weatherCard").classList.remove("hidden");
}
</script>

</body>
</html>
